<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SOS Médecins Burkina Faso — Planche animée</title>
<script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<style>
  @font-face { font-family: 'Oswald'; font-weight: 700; src: url('/node_modules/@fontsource/oswald/files/oswald-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Oswald'; font-weight: 600; src: url('/node_modules/@fontsource/oswald/files/oswald-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url('/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url('/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url('/node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; src: url('/node_modules/@fontsource/nunito/files/nunito-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 900; src: url('/node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2') format('woff2'); }

  :root { --green: #0da255; --green-dark: #08793f; --red: #e81e27; --black: #232021; --yellow: #ffd21f; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: 'Nunito', sans-serif; color: var(--black); }
  #ui > * { position: absolute; }

  .logo-card { right: 34px; top: 34px; width: 200px; height: 200px; background: #fff; border-radius: 30px;
    box-sizing: border-box; padding: 8px; transform-origin: 100% 0; z-index: 70; }
  .logo-card img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .sub { left: 50px; width: 980px; bottom: 236px; text-align: center; z-index: 65; }
  .sub span { display: inline-block; font: 800 47px/1.24 'Nunito', sans-serif; color: #fff; background: rgba(14,14,14,.8);
    padding: 16px 30px 18px; border-radius: 20px; text-wrap: balance; max-width: 920px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

  .banner { left: 0; width: 1080px; text-align: center; z-index: 30; }
  .banner span { display: inline-block; font: 700 86px/1.08 'Oswald', sans-serif; text-transform: uppercase; color: #fff;
    padding: 10px 34px 16px; border: 7px solid #fff; border-radius: 20px; box-shadow: 0 14px 30px rgba(0,0,0,.35); text-wrap: balance; letter-spacing: .5px; max-width: 900px; }
  .banner.red span { background: var(--red); }
  .banner.green span { background: var(--green); }
  .banner.yellow span { background: var(--yellow); color: var(--black); border-color: #fff; }
  .banner.white span { background: #fff; color: var(--black); border-color: var(--green); }
  .banner.lower span { text-transform: none; }

  .card3d { z-index: 20; }
  .card3d .frame { position: absolute; inset: 0; border: 7px solid #fff; border-radius: 22px; box-shadow: 0 12px 28px rgba(0,0,0,.35); }
  .card3d .cap { position: absolute; left: 7px; right: 7px; bottom: 7px; padding: 8px 14px 10px; border-radius: 0 0 15px 15px;
    font: 600 32px/1.12 'Oswald', sans-serif; color: #fff; text-align: center; background: rgba(11,138,70,.94); text-wrap: balance; }
  .card3d .cap.red { background: rgba(232,30,39,.94); }
  .card3d .num { position: absolute; left: -16px; top: -16px; width: 84px; height: 84px; border-radius: 50%; background: var(--red);
    border: 6px solid #fff; box-sizing: border-box; color: #fff; font: 700 50px/70px 'Oswald', sans-serif; text-align: center; box-shadow: 0 6px 14px rgba(0,0,0,.3); }

  .ring { z-index: 20; border-radius: 50%; border: 10px solid var(--red); box-sizing: border-box; box-shadow: 0 12px 30px rgba(0,0,0,.35), inset 0 0 0 4px #fff; }

  .tag { z-index: 31; font: 700 44px/1.1 'Oswald', sans-serif; color: #fff; background: var(--red); padding: 8px 22px 12px; border-radius: 14px;
    border: 5px solid #fff; box-shadow: 0 8px 20px rgba(0,0,0,.3); text-align: center; white-space: nowrap; }
  .tag.green { background: var(--green); }
  .tag.dark { background: rgba(20,20,20,.85); }
  .tag.yellow { background: var(--yellow); color: var(--black); }
  .tag .sm { display: block; font: 700 30px/1.1 'Nunito', sans-serif; }

  .row { z-index: 22; display: flex; align-items: center; gap: 22px; background: #fff; border-radius: 22px; padding: 12px 22px 12px 12px;
    box-sizing: border-box; box-shadow: 0 10px 24px rgba(0,0,0,.28); border: 5px solid var(--red); }
  .row .ic { flex: 0 0 96px; height: 96px; border-radius: 18px; background: #fdecec; display: grid; place-items: center; }
  .row .ic svg { width: 82px; height: 82px; }
  .row .tx { font: 700 40px/1.1 'Oswald', sans-serif; color: var(--black); text-transform: uppercase; }

  .icon { z-index: 22; text-align: center; }
  .icon .disc { width: 176px; height: 176px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #eef3f6 60%, #d6dee3);
    border: 6px solid #fff; box-shadow: 0 10px 24px rgba(0,0,0,.32); display: grid; place-items: center; }
  .icon .disc svg { width: 140px; height: 140px; }
  .icon .lb { margin-top: 10px; font: 700 33px/1.08 'Oswald', sans-serif; color: #fff; text-shadow: 0 3px 8px rgba(0,0,0,.8), 0 0 2px #000; }

  .label { z-index: 25; font: 700 40px/1.05 'Oswald', sans-serif; color: #fff; background: var(--red); padding: 8px 20px 12px; border-radius: 14px;
    border: 5px solid #fff; box-shadow: 0 8px 20px rgba(0,0,0,.3); text-align: center; }
  .callout { z-index: 25; font: 700 32px/1.1 'Oswald', sans-serif; background: #fff; color: var(--black); padding: 10px 18px 12px; border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,.3); border: 4px solid var(--black); text-align: center; }

  .ribbon { left: 0; width: 1080px; z-index: 32; background: var(--red); color: #fff; text-align: center; padding: 16px 40px 20px; box-sizing: border-box;
    font: 700 44px/1.12 'Oswald', sans-serif; text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,.35); border-top: 6px solid #fff; border-bottom: 6px solid #fff; }
  .ribbon small { display: block; font: 800 30px/1.2 'Nunito', sans-serif; text-transform: none; color: var(--yellow); margin-bottom: 4px; }

  .vignette { inset: 0; z-index: 5; background: radial-gradient(ellipse at 50% 45%, rgba(232,30,39,0) 40%, rgba(160,10,16,.6) 100%); }
  .shade { left: 0; width: 1080px; bottom: 0; height: 620px; z-index: 4; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.55)); }

  .wipe { inset: 0; z-index: 80; }
  .wipe div { position: absolute; top: -300px; height: 2520px; }

  .endcard { inset: 0; z-index: 45; background: #fff; overflow: hidden; }
  .endcard svg.sw { position: absolute; left: 0; width: 1080px; }
  /* planche animée: wide logo card, subtitles in a dark lower band, live FX layer */
  .logo-card { width: 420px; height: 236px; right: 22px; top: 22px; padding: 12px; border-radius: 26px; }
  .band { left: 0; width: 1080px; top: 1540px; height: 380px; z-index: 60; background: linear-gradient(to bottom, rgba(14,14,14,0) 0, rgba(14,14,14,.94) 60px, #101010 100px); }
  .band::before { content: ''; position: absolute; left: 0; right: 0; top: 60px; height: 6px; background: linear-gradient(90deg, var(--green) 0 50%, var(--red) 50% 100%); }
  .sub { bottom: 130px; left: 20px; width: 1040px; }
  .sub span { background: none; box-shadow: none; font-size: 50px; padding: 0 10px; max-width: 1000px; }
  #fx { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; }
  .hl { z-index: 15; border: 8px solid #ffd21f; border-radius: 22px; box-shadow: 0 0 0 4px rgba(0,0,0,.25), 0 0 40px rgba(255,210,31,.75); box-sizing: border-box; }
  .scrim { left: 0; width: 1080px; z-index: 6; background: rgba(20,4,6,.55); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="ui"></div>
</div>
<script type="module" src="/src/planche.js"></script>
</body>
</html>
