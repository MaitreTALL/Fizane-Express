name: Tondraaga mobile audit

# Opens the public pages of the shop in a phone-sized browser and stores screenshots and
# a report (overflowing elements, English texts, broken images, errors) in the branch.
on:
  push:
    branches: [ccr-823f62ce-tc8p8p]
    paths:
      - 'tondraaga-app/audit/pages.json'
      - 'tondraaga-app/audit/shoot.cjs'
      - 'tondraaga-app/audit/fetch.txt'
      - 'tondraaga-app/audit/*.html'
      - 'tondraaga-app/audit/traitement.sh'
      - '.github/workflows/tondraaga-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency: tondraaga-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright-core@1.63.0 >/dev/null
          which google-chrome || which chromium || ls /opt/google/chrome
      - name: Fetch reference files
        run: |
          rm -rf tondraaga-app/audit/out && mkdir -p tondraaga-app/audit/out/fetch
          while read -r name url; do
            [ -n "$name" ] || continue
            curl -fsSL -A "Mozilla/5.0 (TondraagaAudit; +https://github.com/MaitreTALL/Fizane-Express)" -o "tondraaga-app/audit/out/fetch/$name" "$url" || echo "failed: $name"
          done < tondraaga-app/audit/fetch.txt
          # public map keys embedded in some fetched pages are not needed: blank them before committing
          find tondraaga-app/audit/out/fetch -name '*.html' -exec sed -i -E 's/\b(pk|sk)\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}/[cle-retiree]/g' {} +
          ls -la tondraaga-app/audit/out/fetch
      - name: Optional processing
        run: |
          if [ -f tondraaga-app/audit/traitement.sh ]; then bash tondraaga-app/audit/traitement.sh; fi
      - name: Audit the pages
        run: |
          CHROME="$(which google-chrome || which chromium)" NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tondraaga-app/audit/shoot.cjs tondraaga-app/audit/pages.json tondraaga-app/audit/out
      - name: Store the results in the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tondraaga-app/audit/out
          git commit -m "Tondraaga: mobile audit results [skip ci]" || exit 0
          git pull --rebase origin ccr-823f62ce-tc8p8p
          git push
