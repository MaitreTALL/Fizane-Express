name: Tondraaga mobile audit

# Opens the public pages of the shop in a phone-sized browser and stores screenshots and
# a report (overflowing elements, English texts, broken images, errors) in the branch.
on:
  push:
    branches: [ccr-823f62ce-tc8p8p]
    paths:
      - 'tondraaga-app/audit/pages.json'
      - 'tondraaga-app/audit/shoot.cjs'
      - '.github/workflows/tondraaga-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency: tondraaga-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright-core@1.63.0 >/dev/null
          which google-chrome || which chromium || ls /opt/google/chrome
      - name: Audit the pages
        run: |
          rm -rf tondraaga-app/audit/out
          CHROME="$(which google-chrome || which chromium)" NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tondraaga-app/audit/shoot.cjs tondraaga-app/audit/pages.json tondraaga-app/audit/out
      - name: Store the results in the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tondraaga-app/audit/out
          git commit -m "Tondraaga: mobile audit results [skip ci]" || exit 0
          git pull --rebase origin ccr-823f62ce-tc8p8p
          git push
