name: Tondraaga voix off

# Voix off des vidéos Tondraaga avec Chatterbox Multilingual (licence MIT) : le travail est réparti sur plusieurs
# machines ; chacune lit sa part des phrases, garde la meilleure prise (vérifiée par reconnaissance vocale) et
# enregistre ses fichiers dans tondraaga-video/voix/sortie/ sur la branche.
on:
  push:
    branches: [ccr-823f62ce-tc8p8p]
    paths:
      - 'tondraaga-video/voix/chatterbox.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency: tondraaga-voix

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tondraaga-video/tools
            tondraaga-video/voix
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/uv
          key: chatterbox-0.1.7-whisper-small-v1
      - name: Install Chatterbox and faster-whisper
        run: |
          python3 -m pip install -q uv
          uv venv -q -p 3.11 "$RUNNER_TEMP/cb"
          . "$RUNNER_TEMP/cb/bin/activate"
          uv pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -q chatterbox-tts==0.1.7 "setuptools<81" faster-whisper
      - name: Read the lines
        run: |
          . "$RUNNER_TEMP/cb/bin/activate"
          python tondraaga-video/tools/chatterbox_voix.py tondraaga-video/voix/sortie ${{ matrix.part }} 8 2>&1 | grep -v -i "warn"
      - name: Store the takes in the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tondraaga-video/voix/sortie
          git commit -q -m "Tondraaga: voice-over takes, part ${{ matrix.part }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin ccr-823f62ce-tc8p8p && git push -q && exit 0; sleep $((i * 7)); done
          exit 1
