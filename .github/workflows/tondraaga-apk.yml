name: Tondraaga APK

# Builds the Tondraaga Android app (tondraaga-app/) with the official Android SDK of the
# runner and stores the unsigned, zip-aligned APK in the branch. Signing happens outside CI,
# with a key that never enters this public repository.
on:
  push:
    branches: [ccr-823f62ce-tc8p8p]
    paths:
      - 'tondraaga-app/**'
      - '.github/workflows/tondraaga-apk.yml'
      - '!tondraaga-app/build/**'
      - '!tondraaga-app/dist/**'
      - '!tondraaga-app/tools/**'
      - '!tondraaga-app/README.md'
      - '!tondraaga-app/audit/**'
      - '!tondraaga-app/web/**'
      - '!tondraaga-app/play-store/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency: tondraaga-apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 16 platform (target SDK 36, required by Google Play)
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
            yes | "$SDKM" --licenses >/dev/null || true
            "$SDKM" "platforms;android-36" >/dev/null
          fi
          ls "$ANDROID_HOME/platforms"
      - name: Build the unsigned APK and App Bundle
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          echo "build-tools: $BT"
          echo "platform: $JAR"
          VC="$(cat tondraaga-app/VERSION_CODE)"; VN="$(cat tondraaga-app/VERSION_NAME)"
          tondraaga-app/build.sh "$BT" "$JAR" "$RUNNER_TEMP/out" "$VC" "$VN"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          tondraaga-app/build-aab.sh "$BT" "$JAR" "$RUNNER_TEMP/out" "$VC" "$VN" "$RUNNER_TEMP/bundletool.jar"
      - name: Store them in the branch
        run: |
          mkdir -p tondraaga-app/build
          cp "$RUNNER_TEMP/out/tondraaga-unsigned.apk" "$RUNNER_TEMP/out/tondraaga-unsigned.aab" tondraaga-app/build/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tondraaga-app/build/tondraaga-unsigned.apk tondraaga-app/build/tondraaga-unsigned.aab
          git commit -m "Tondraaga: unsigned APK and App Bundle built by CI [skip ci]" || exit 0
          git pull --rebase origin ccr-823f62ce-tc8p8p
          git push
